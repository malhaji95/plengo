<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق تعليمي للطلاب">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFD62C">
  <meta name="apple-mobile-web-app-title" content="Plengo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plengo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while the app downloads (tens of seconds on 3G, spec §34.3); removed at the first frame. */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px; background: #FFD62C; color: #1B1B1B;
      font: 16px system-ui, sans-serif; transition: opacity .2s; }
    #boot img { width: min(280px, 70vw); height: auto; }
    #boot .spinner { width: 36px; height: 36px; border: 4px solid rgba(27,27,27,.2); border-top-color: #1B1B1B;
      border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="assets/assets/brand/wordmark-color.png" alt="Plengo">
    <div class="spinner"></div>
    <div>جارٍ تحميل التطبيق…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script src="boot.js" defer></script>
</body>
</html>
