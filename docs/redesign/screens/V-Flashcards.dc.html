 width:390px;height:844px;display:flex;flex-direction:column;font-family:'Montserrat Arabic',sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;position:relative}

    </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0, f: false, log: [] }; }
  renderVals() {
    const Q = [['new','ما قاعدة مشتقة الجداء؟',"(f·g)' = f'g + fg'",'الأولى × مشتقة الثانية + العكس'],
               ['learn','ما مشتقة sin x ؟','cos x','دوال مثلثية'],
               ['review','ما مشتقة الثابت؟','0','قاعدة أساسية']];
    const { i, f, log } = this.state, done = i >= Q.length, c = Q[Math.min(i, Q.length - 1)];
    const used = { new: 0, learn: 0, review: 0 };
    log.forEach(x => { used[x.type]++; });
    const B = [['new','جديدة',5,'#0074B4'],['learn','تعلّم',2,'#C66A00'],['review','مراجعة',10,'#157A22']];
    const rate = r => () => this.setState({ i: i + 1, f: false, log: log.concat([{ type: c[0], r }]) });
    const tally = r => String(log.filter(x => x.r === r).length);
    return {
      done, notDone: !done, showFlip: !done && !f, showRate: !done && f, canUndo: !done && log.length > 0,
      counts: B.map(([id, t, n, col]) => ({ t, n: String(n - used[id]),
        num: 'font-size:20px;font-weight:700;color:' + col,
        line: 'height:3px;width:28px;border-radius:2px;background:' + (id === c[0] && !done ? col : 'transparent') })),
      bar: 'width:' + Math.round(log.length / 17 * 100) + '%;background:#0074B4',
      c: { tag: c[0] === 'new' ? 'بطاقة جديدة' : c[0] === 'learn' ? 'قيد التعلم' : 'مراجعة', q: c[1], a: c[2], note: c[3] },
      flipCls: f ? 'on' : '',
      hint: f ? 'كيف كان تذكّرك؟' : 'اضغط على البطاقة لعرض الإجابة',
      flip: () => this.setState({ f: !f }),
      again: rate('a'), good: rate('g'), easy: rate('e'),
      undo: () => this.setState({ i: Math.max(0, i - 1), f: true, log: log.slice(0, -1) }),
      s: { a: tally('a'), g: tally('g'), e: tally('e') }
    };
  }
}
</script>
