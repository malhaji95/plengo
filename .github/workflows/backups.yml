# Backups and the restore drill (spec §35). Credentials live in the "production" environment:
#   secrets: DATABASE_URL (a read-only role is enough), RCLONE_CONFIG (an rclone.conf with the
#   "r2" source and "backup" destination remotes)
#   vars:    BACKUP_REMOTE (e.g. backup:plengo-db), MEDIA_BACKUP (e.g. backup:plengo-media)
name: Backups

on:
  schedule:
    - cron: '15 1 * * *' # daily database dump (04:15 Damascus)
    - cron: '40 1 * * 0' # weekly media copy, Sundays
    - cron: '0 3 1 * *' # monthly restore drill
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [database, media, drill]
        default: database

concurrency: backups

jobs:
  database:
    if: github.event.schedule == '15 1 * * *' || inputs.task == 'database'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 rclone
      - name: Configure rclone
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      - name: Dump and upload
        run: ops/backup/db-backup.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}

  media:
    if: github.event.schedule == '40 1 * * 0' || inputs.task == 'media'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Configure rclone
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      - name: Sync buckets
        run: ops/backup/media-sync.sh
        env:
          MEDIA_SOURCE: 'r2:'
          MEDIA_BACKUP: ${{ vars.MEDIA_BACKUP }}

  drill:
    if: github.event.schedule == '0 3 1 * *' || inputs.task == 'drill'
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: drill
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 rclone
      - name: Configure rclone
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      - name: Restore the newest dump into a throwaway database
        run: ops/backup/restore-drill.sh
        env:
          DUMP: latest
          BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
          RESTORE_URL: postgres://postgres@localhost:5432/drill
