# Test APK for Android phones (docs/demo-hosting.md). Manual: builds a release APK pointed at the
# API you enter, signed with the debug key (fine for installing directly, not for Google Play).
# Download it from the run's "Artifacts" section.
name: Build test APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API address, e.g. https://plengo-api.onrender.com
        type: string
        required: true
      coupon_redemption:
        description: Show activation-code redemption
        type: boolean
        default: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=COUPON_REDEMPTION=${{ inputs.coupon_redemption }}
      - uses: actions/upload-artifact@v4
        with:
          name: plengo-test-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
