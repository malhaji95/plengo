name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: API, admin, packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations are in sync with the schema
        run: |
          pnpm --filter @plengo/db exec drizzle-kit check
          pnpm db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: OpenAPI and admin client are up to date
        run: |
          pnpm --filter @plengo/api openapi
          pnpm --filter @plengo/admin api-types
          git diff --exit-code -- packages/contracts/openapi.json apps/admin/src/lib/api-schema.d.ts
      - name: Arabic normalizer and SRS fixtures
        run: pnpm --filter @plengo/arabic-normalizer --filter @plengo/srs test
      - name: API tests (Postgres)
        run: pnpm --filter @plengo/api test
      - name: Admin tests
        run: pnpm --filter @plengo/admin test
      - name: Build
        run: pnpm build && pnpm --filter @plengo/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com

  flutter:
    name: Student app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated API client and code are up to date
        run: |
          rm -rf lib/core/api/generated
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
          test -z "$(git status --porcelain -- lib)"
      - name: Dart format (hand-written code)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' -not -path 'lib/core/api/generated/*' -not -name '*.g.dart')
      - run: flutter analyze
      - run: flutter test
      - name: Web build (no CDN resources)
        run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=https://api.example.com
      - name: Web first-load budget (spec §34.3)
        run: node tool/web_size.mjs build/web --budget-kb 4096

  docker:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t plengo-api:ci .
